name: Validate Kotlin Gradle Plugin CVE

on:
  workflow_dispatch:

  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Give permission to Gradle
        run: chmod +x ./gradlew

      - name: Show Gradle version
        run: |
          ./gradlew --version

      - name: Search Kotlin configuration
        run: |
          echo "=========================================="
          echo " Kotlin references found in project"
          echo "=========================================="

          grep -Rni "kotlin" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml" \
            . || true

      - name: Check Kotlin Gradle Plugin version
        run: |
          echo "=========================================="
          echo " Kotlin Gradle Plugin dependency"
          echo "=========================================="

          ./gradlew buildEnvironment > build-environment.txt 2>&1 || true

          cat build-environment.txt

          echo ""
          echo "========== FILTER =========="

          grep -i "kotlin-gradle-plugin" build-environment.txt || true

      - name: First build with Gradle Build Cache
        run: |
          echo "=========================================="
          echo " FIRST BUILD"
          echo "=========================================="

          ./gradlew clean assembleDebug \
            --build-cache \
            --info \
            > first-build.log 2>&1 || true

          tail -100 first-build.log

      - name: Second build with Gradle Build Cache
        run: |
          echo "=========================================="
          echo " SECOND BUILD"
          echo "=========================================="

          ./gradlew assembleDebug \
            --build-cache \
            --info \
            > second-build.log 2>&1 || true

          tail -100 second-build.log

      - name: Search for cache usage
        run: |
          echo "=========================================="
          echo " CACHE RESULTS"
          echo "=========================================="

          echo ""
          echo "--- FIRST BUILD ---"

          grep -Ei \
            "FROM-CACHE|build cache|cache entry|stored cache|loaded cache" \
            first-build.log || true

          echo ""
          echo "--- SECOND BUILD ---"

          grep -Ei \
            "FROM-CACHE|build cache|cache entry|stored cache|loaded cache" \
            second-build.log || true

      - name: Generate final validation summary
        if: always()
        run: |
          echo "# Kotlin CVE Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Resultado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Verificação | Resultado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY

          PLUGIN_FOUND="false"
          CACHE_FOUND="false"
          CACHE_REUSED="false"

          if grep -q "kotlin-gradle-plugin:2.2.10" build-environment.txt; then
            PLUGIN_FOUND="true"

            echo "| Kotlin Gradle Plugin 2.2.10 | ❌ Vulnerável detectado |" \
              >> $GITHUB_STEP_SUMMARY
          else
            echo "| Kotlin Gradle Plugin 2.2.10 | ✅ Não detectado |" \
              >> $GITHUB_STEP_SUMMARY
          fi

          if grep -Eqi \
            "build cache|stored cache entry|cache entry" \
            first-build.log second-build.log; then

            CACHE_FOUND="true"

            echo "| Gradle Build Cache | ⚠️ Ativo |" \
              >> $GITHUB_STEP_SUMMARY
          else
            echo "| Gradle Build Cache | ✅ Não identificado |" \
              >> $GITHUB_STEP_SUMMARY
          fi

          if grep -Eqi \
            "FROM-CACHE|loaded cache entry" \
            second-build.log; then

            CACHE_REUSED="true"

            echo "| Reutilização de cache | ⚠️ Confirmada |" \
              >> $GITHUB_STEP_SUMMARY
          else
            echo "| Reutilização de cache | ⚪ Não confirmada |" \
              >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Diagnóstico" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$PLUGIN_FOUND" = "true" ] && \
             [ "$CACHE_FOUND" = "true" ] && \
             [ "$CACHE_REUSED" = "true" ]; then

            echo "### ⚠️ TRUE POSITIVE / REACHABLE" \
              >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY

            echo "A versão vulnerável do Kotlin Gradle Plugin foi detectada." \
              >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY

            echo "O Gradle Build Cache está ativo e foi reutilizado." \
              >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY

            echo "Isso confirma que o componente vulnerável está presente e que o caminho relacionado ao cache é alcançável durante o build." \
              >> $GITHUB_STEP_SUMMARY

          elif [ "$PLUGIN_FOUND" = "true" ]; then

            echo "### ⚠️ DEPENDÊNCIA VULNERÁVEL PRESENTE" \
              >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY

            echo "A versão vulnerável foi encontrada, mas a reutilização do Build Cache não foi confirmada." \
              >> $GITHUB_STEP_SUMMARY

          else

            echo "### ✅ VERSÃO VULNERÁVEL NÃO DETECTADA" \
              >> $GITHUB_STEP_SUMMARY

          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## RCE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Validação | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependência vulnerável presente | $PLUGIN_FOUND |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Cache ativo | $CACHE_FOUND |" >> $GITHUB_STEP_SUMMARY
          echo "| Cache reutilizado | $CACHE_REUSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Execução arbitrária demonstrada | ❌ NÃO |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "> Este workflow valida presença e reachability. Ele não injeta um objeto malicioso no Build Cache, portanto não demonstra RCE por si só." \
            >> $GITHUB_STEP_SUMMARY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-cve-validation
          path: |
            build-environment.txt
            first-build.log
            second-build.log
