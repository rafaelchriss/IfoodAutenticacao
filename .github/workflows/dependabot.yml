version: 2

updates:
  # Dependências Android / Kotlin / Gradle
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"

    open-pull-requests-limit: 10

    labels:
      - "dependencies"
      - "security"

    groups:
      android-dependencies:
        patterns:
          - "*"

  # Actions usadas nos workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Sao_Paulo"

    labels:
      - "dependencies"
      - "github-actions"
