name: Mobile Security - Nuclei

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  mobile-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Give Gradle permission
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          ./gradlew assembleDebug

      - name: Find APK
        id: apk
        run: |
          APK=$(find . -type f -name "*.apk" | head -n 1)

          echo "APK encontrado:"
          echo "$APK"

          echo "apk=$APK" >> $GITHUB_OUTPUT

      - name: Install apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Decompile APK
        run: |
          mkdir -p decompiled

          apktool d \
            "${{ steps.apk.outputs.apk }}" \
            -o decompiled/app \
            -f

      - name: Install Nuclei
        run: |
          curl -s https://api.github.com/repos/projectdiscovery/nuclei/releases/latest \
          | grep "browser_download_url.*linux_amd64.zip" \
          | cut -d '"' -f 4 \
          | wget -qi -

          unzip nuclei_*_linux_amd64.zip

          sudo mv nuclei /usr/local/bin/

          nuclei -version

      - name: Clone Mobile Nuclei Templates
        run: |
          git clone https://github.com/optiv/mobile-nuclei-templates.git

      - name: Run Android Templates
        run: |
          echo "$(pwd)/decompiled/app/" \
          | nuclei \
              -t mobile-nuclei-templates/Android/ \
              -jsonl \
              -o nuclei-android.jsonl \
              || true

      - name: Run API Key Templates
        run: |
          echo "$(pwd)/decompiled/app/" \
          | nuclei \
              -t mobile-nuclei-templates/Keys/ \
              -jsonl \
              -o nuclei-keys.jsonl \
              || true

      - name: Show findings
        run: |
          echo "======================================"
          echo "ANDROID FINDINGS"
          echo "======================================"

          cat nuclei-android.jsonl || true

          echo ""
          echo "======================================"
          echo "KEY FINDINGS"
          echo "======================================"

          cat nuclei-keys.jsonl || true

      - name: Create SARIF
        run: |
          python3 <<'PY'
          import json
          import os

          files = [
              "nuclei-android.jsonl",
              "nuclei-keys.jsonl"
          ]

          results = []
          rules = {}
          counter = 0

          for filename in files:
              if not os.path.exists(filename):
                  continue

              with open(filename, "r", encoding="utf-8") as f:
                  for line in f:

                      line = line.strip()

                      if not line:
                          continue

                      try:
                          finding = json.loads(line)
                      except Exception:
                          continue

                      info = finding.get("info", {})

                      name = info.get("name", "Nuclei Finding")
                      severity = info.get("severity", "unknown")

                      template_id = finding.get(
                          "template-id",
                          f"nuclei-{counter}"
                      )

                      matched = (
                          finding.get("matched-at")
                          or finding.get("host")
                          or "mobile-application"
                      )

                      description = info.get(
                          "description",
                          name
                      )

                      rule_id = template_id

                      rules[rule_id] = {
                          "id": rule_id,
                          "name": name.replace(" ", "_"),
                          "shortDescription": {
                              "text": name
                          },
                          "fullDescription": {
                              "text": description
                          },
                          "properties": {
                              "security-severity": {
                                  "critical": "9.0",
                                  "high": "8.0",
                                  "medium": "5.0",
                                  "low": "3.0",
                                  "info": "1.0",
                                  "unknown": "1.0"
                              }.get(
                                  severity.lower(),
                                  "1.0"
                              )
                          }
                      }

                      level = {
                          "critical": "error",
                          "high": "error",
                          "medium": "warning",
                          "low": "note",
                          "info": "note"
                      }.get(
                          severity.lower(),
                          "warning"
                      )

                      results.append({
                          "ruleId": rule_id,
                          "level": level,
                          "message": {
                              "text": (
                                  f"{name}\n"
                                  f"Severity: {severity}\n"
                                  f"Matched: {matched}"
                              )
                          }
                      })

                      counter += 1

          sarif = {
              "version": "2.1.0",
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "runs": [
                  {
                      "tool": {
                          "driver": {
                              "name": "Nuclei Mobile Security",
                              "informationUri": "https://github.com/projectdiscovery/nuclei",
                              "rules": list(rules.values())
                          }
                      },
                      "results": results
                  }
              ]
          }

          with open("nuclei-results.sarif", "w") as f:
              json.dump(sarif, f, indent=2)

          print(
              f"{len(results)} finding(s) converted to SARIF."
          )
          PY

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: nuclei-results.sarif
          category: mobile-nuclei

      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: mobile-nuclei-results
          path: |
            nuclei-android.jsonl
            nuclei-keys.jsonl
            nuclei-results.sarif
