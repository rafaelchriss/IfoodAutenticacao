name: Mobile Security - Nuclei

on:
  workflow_dispatch:

  push:
    branches:
      - master
      - main

  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read
  security-events: write

jobs:
  mobile-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Give Gradle permission
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          ./gradlew assembleDebug

      - name: Find APK
        id: apk
        run: |
          APK=$(find . -type f -name "*.apk" | head -n 1)

          echo "APK encontrado:"
          echo "$APK"

          echo "apk=$APK" >> $GITHUB_OUTPUT

      - name: Install apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Decompile APK
        run: |
          mkdir -p decompiled

          apktool d \
            "${{ steps.apk.outputs.apk }}" \
            -o decompiled/app \
            -f

      - name: Install Nuclei
        run: |
          curl -s https://api.github.com/repos/projectdiscovery/nuclei/releases/latest \
          | grep "browser_download_url.*linux_amd64.zip" \
          | cut -d '"' -f 4 \
          | wget -qi -

          unzip nuclei_*_linux_amd64.zip

          sudo mv nuclei /usr/local/bin/

          nuclei -version

      - name: Clone Mobile Nuclei Templates
        run: |
          git clone https://github.com/optiv/mobile-nuclei-templates.git

      - name: Run Android Templates
        run: |
          echo "$(pwd)/decompiled/app/" \
          | nuclei \
              -t mobile-nuclei-templates/Android/ \
              -jsonl \
              -o nuclei-android.jsonl \
              || true

      - name: Run API Key Templates
        run: |
          echo "$(pwd)/decompiled/app/" \
          | nuclei \
              -t mobile-nuclei-templates/Keys/ \
              -jsonl \
              -o nuclei-keys.jsonl \
              || true

      - name: Show findings in logs
        if: always()
        run: |
          echo "======================================"
          echo "ANDROID FINDINGS"
          echo "======================================"

          cat nuclei-android.jsonl || true

          echo ""
          echo "======================================"
          echo "KEY FINDINGS"
          echo "======================================"

          cat nuclei-keys.jsonl || true

      - name: Create SARIF
        if: always()
        run: |
          python3 <<'PY'
          import json
          import os

          files = [
              ("Android", "nuclei-android.jsonl"),
              ("API Keys", "nuclei-keys.jsonl")
          ]

          results = []
          rules = {}
          counter = 0

          for source, filename in files:

              if not os.path.exists(filename):
                  continue

              with open(filename, "r", encoding="utf-8") as f:

                  for line in f:

                      line = line.strip()

                      if not line:
                          continue

                      try:
                          finding = json.loads(line)
                      except Exception:
                          continue

                      info = finding.get("info", {})

                      name = info.get(
                          "name",
                          "Nuclei Finding"
                      )

                      severity = info.get(
                          "severity",
                          "unknown"
                      ).lower()

                      template_id = finding.get(
                          "template-id",
                          f"nuclei-{counter}"
                      )

                      matched = (
                          finding.get("matched-at")
                          or finding.get("host")
                          or "mobile-application"
                      )

                      description = info.get(
                          "description",
                          name
                      )

                      rule_id = template_id

                      rules[rule_id] = {
                          "id": rule_id,
                          "name": name.replace(" ", "_"),
                          "shortDescription": {
                              "text": name
                          },
                          "fullDescription": {
                              "text": description
                          },
                          "properties": {
                              "security-severity": {
                                  "critical": "9.5",
                                  "high": "8.0",
                                  "medium": "5.0",
                                  "low": "3.0",
                                  "info": "1.0",
                                  "unknown": "1.0"
                              }.get(
                                  severity,
                                  "1.0"
                              )
                          }
                      }

                      level = {
                          "critical": "error",
                          "high": "error",
                          "medium": "warning",
                          "low": "note",
                          "info": "note"
                      }.get(
                          severity,
                          "warning"
                      )

                      results.append({
                          "ruleId": rule_id,
                          "level": level,
                          "message": {
                              "text": (
                                  f"{name}\n"
                                  f"Severity: {severity}\n"
                                  f"Source: {source}\n"
                                  f"Matched: {matched}"
                              )
                          }
                      })

                      counter += 1

          sarif = {
              "version": "2.1.0",
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "runs": [
                  {
                      "tool": {
                          "driver": {
                              "name": "Nuclei Mobile Security",
                              "informationUri": "https://github.com/projectdiscovery/nuclei",
                              "rules": list(rules.values())
                          }
                      },
                      "results": results
                  }
              ]
          }

          with open(
              "nuclei-results.sarif",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  sarif,
                  f,
                  indent=2
              )

          print(
              f"{len(results)} finding(s) converted to SARIF."
          )
          PY

      - name: Generate Mobile Security Summary
        if: always()
        run: |
          echo "# 📱 Mobile Security - Nuclei" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          python3 <<'PY'
          import json
          import os
          from collections import Counter

          files = [
              ("Android", "nuclei-android.jsonl"),
              ("API Keys", "nuclei-keys.jsonl")
          ]

          findings = []

          for source, filename in files:

              if not os.path.exists(filename):
                  continue

              with open(
                  filename,
                  "r",
                  encoding="utf-8"
              ) as f:

                  for line in f:

                      line = line.strip()

                      if not line:
                          continue

                      try:
                          item = json.loads(line)
                      except Exception:
                          continue

                      info = item.get(
                          "info",
                          {}
                      )

                      finding = {
                          "source": source,
                          "name": info.get(
                              "name",
                              "Nuclei Finding"
                          ),
                          "severity": info.get(
                              "severity",
                              "unknown"
                          ).lower(),
                          "template": item.get(
                              "template-id",
                              "unknown"
                          ),
                          "matched": (
                              item.get("matched-at")
                              or item.get("host")
                              or "N/A"
                          ),
                          "description": info.get(
                              "description",
                              ""
                          )
                      }

                      findings.append(finding)

          severity_order = [
              "critical",
              "high",
              "medium",
              "low",
              "info",
              "unknown"
          ]

          icons = {
              "critical": "🔴",
              "high": "🟠",
              "medium": "🟡",
              "low": "🔵",
              "info": "⚪",
              "unknown": "⚫"
          }

          counts = Counter(
              item["severity"]
              for item in findings
          )

          summary_file = os.environ[
              "GITHUB_STEP_SUMMARY"
          ]

          with open(
              summary_file,
              "a",
              encoding="utf-8"
          ) as out:

              out.write(
                  "## 📊 Resultado geral\n\n"
              )

              out.write(
                  "| Severidade | Quantidade |\n"
              )

              out.write(
                  "|---|---:|\n"
              )

              for severity in severity_order:

                  out.write(
                      f"| {icons[severity]} "
                      f"{severity.upper()} | "
                      f"{counts.get(severity, 0)} |\n"
                  )

              out.write("\n")

              out.write(
                  f"### Total de findings: "
                  f"{len(findings)}\n\n"
              )

              if not findings:

                  out.write(
                      "## ✅ Nenhuma vulnerabilidade encontrada\n\n"
                  )

                  out.write(
                      "Os templates Android e Keys "
                      "não identificaram findings.\n"
                  )

              else:

                  out.write(
                      "## 🚨 Vulnerabilidades encontradas\n\n"
                  )

                  out.write(
                      "| Severidade | Vulnerabilidade | "
                      "Origem | Template | Evidência |\n"
                  )

                  out.write(
                      "|---|---|---|---|---|\n"
                  )

                  def severity_index(item):

                      try:
                          return severity_order.index(
                              item["severity"]
                          )

                      except ValueError:
                          return 99

                  findings.sort(
                      key=severity_index
                  )

                  for finding in findings:

                      severity = finding[
                          "severity"
                      ]

                      name = (
                          finding["name"]
                          .replace("|", "\\|")
                          .replace("\n", " ")
                      )

                      source = (
                          finding["source"]
                          .replace("|", "\\|")
                      )

                      template = (
                          finding["template"]
                          .replace("|", "\\|")
                      )

                      matched = (
                          finding["matched"]
                          .replace("|", "\\|")
                          .replace("\n", " ")
                      )

                      out.write(
                          f"| "
                          f"{icons.get(severity, '⚫')} "
                          f"{severity.upper()} | "
                          f"{name} | "
                          f"{source} | "
                          f"`{template}` | "
                          f"`{matched}` |\n"
                      )

                  out.write("\n")

                  out.write(
                      "## 🔎 Detalhes dos findings\n\n"
                  )

                  for index, finding in enumerate(
                      findings,
                      start=1
                  ):

                      severity = finding[
                          "severity"
                      ]

                      out.write(
                          f"### {index}. "
                          f"{icons.get(severity, '⚫')} "
                          f"{finding['name']}\n\n"
                      )

                      out.write(
                          f"- **Severidade:** "
                          f"{severity.upper()}\n"
                      )

                      out.write(
                          f"- **Origem:** "
                          f"{finding['source']}\n"
                      )

                      out.write(
                          f"- **Template:** "
                          f"`{finding['template']}`\n"
                      )

                      out.write(
                          f"- **Evidência:** "
                          f"`{finding['matched']}`\n"
                      )

                      if finding["description"]:

                          description = (
                              finding["description"]
                              .replace("\n", " ")
                          )

                          out.write(
                              f"- **Descrição:** "
                              f"{description}\n"
                          )

                      out.write("\n")

              out.write(
                  "## 🧪 Interpretação\n\n"
              )

              if counts.get(
                  "critical",
                  0
              ) > 0:

                  out.write(
                      "🔴 Foram encontrados findings "
                      "CRITICAL. Priorize a validação "
                      "manual desses resultados.\n\n"
                  )

              elif counts.get(
                  "high",
                  0
              ) > 0:

                  out.write(
                      "🟠 Foram encontrados findings "
                      "HIGH que devem ser validados "
                      "manualmente.\n\n"
                  )

              elif len(findings) > 0:

                  out.write(
                      "⚠️ Foram encontrados possíveis "
                      "problemas de segurança que precisam "
                      "de validação manual.\n\n"
                  )

              else:

                  out.write(
                      "✅ Nenhum finding foi identificado "
                      "pelos templates executados.\n\n"
                  )

              out.write(
                  "> O resultado do Nuclei não confirma "
                  "automaticamente uma vulnerabilidade "
                  "explorável. Os findings devem ser "
                  "validados manualmente para descartar "
                  "falsos positivos.\n"
              )

          print(
              f"Summary generated with "
              f"{len(findings)} finding(s)."
          )
          PY

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: nuclei-results.sarif
          category: mobile-nuclei

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-nuclei-results
          path: |
            nuclei-android.jsonl
            nuclei-keys.jsonl
            nuclei-results.sarif
